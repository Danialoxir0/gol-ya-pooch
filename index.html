<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گل یا پوچ | ورود به بازی</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #080808;
  color: #f5f5f5;
  font-family: Tahoma, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.circle {
  position: absolute;
  border: 1px solid #303030;
  border-radius: 50%;
  animation: float 12s ease-in-out infinite alternate;
}

.one {
  width: 350px;
  height: 350px;
  top: -150px;
  right: -100px;
}

.two {
  width: 280px;
  height: 280px;
  bottom: -120px;
  left: -90px;
}

.three {
  width: 120px;
  height: 120px;
  top: 15%;
  left: 12%;
}

@keyframes float {
  from { transform: translateY(0) rotate(0); }
  to { transform: translateY(24px) rotate(25deg); }
}

.container {
  width: 100%;
  max-width: 410px;
  position: relative;
  z-index: 1;
}

.brand {
  text-align: center;
  margin-bottom: 27px;
}

.logo {
  width: 76px;
  height: 76px;
  border: 1px solid #777;
  transform: rotate(45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 25px;
  background: #111;
}

.logo span {
  transform: rotate(-45deg);
  font-size: 32px;
  font-weight: bold;
}

.brand h1 {
  font-size: 29px;
  margin-bottom: 10px;
}

.brand p {
  color: #999;
  font-size: 12px;
  line-height: 2;
}

.card {
  border: 1px solid #292929;
  background: rgba(15, 15, 15, .97);
  padding: 27px 23px;
  border-radius: 15px;
  box-shadow: 0 20px 70px #000;
}

.tabs {
  display: flex;
  gap: 8px;
  padding: 5px;
  border: 1px solid #292929;
  border-radius: 9px;
  margin-bottom: 25px;
  background: #090909;
}

.tab {
  flex: 1;
  padding: 12px 5px;
  color: #999;
  background: transparent;
  border: 0;
  border-radius: 6px;
  font-family: inherit;
  cursor: pointer;
  font-size: 13px;
}

.tab.active {
  background: #f1f1f1;
  color: #111;
  font-weight: bold;
}

h2 {
  font-size: 21px;
  margin-bottom: 9px;
}

.subtitle {
  color: #888;
  font-size: 12px;
  line-height: 2;
  margin-bottom: 24px;
}

.field {
  margin-bottom: 17px;
}

label {
  display: block;
  font-size: 12px;
  color: #c8c8c8;
  margin-bottom: 9px;
}

input {
  width: 100%;
  padding: 14px;
  background: #090909;
  color: white;
  border: 1px solid #343434;
  border-radius: 8px;
  outline: none;
  font-family: inherit;
  font-size: 13px;
  direction: ltr;
  text-align: left;
}

input:focus {
  border-color: #aaa;
}

input::placeholder {
  color: #606060;
}

.submit {
  width: 100%;
  padding: 15px;
  background: #f1f1f1;
  color: #090909;
  border: 0;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.submit:disabled {
  opacity: .55;
  cursor: wait;
}

.message {
  display: none;
  font-size: 12px;
  line-height: 2;
  padding: 12px;
  margin-top: 17px;
  border-radius: 7px;
  overflow-wrap: anywhere;
}

.message.show {
  display: block;
}

.message.success {
  background: #102016;
  border: 1px solid #28563a;
  color: #b5efc5;
}

.message.error {
  background: #261111;
  border: 1px solid #633030;
  color: #ffc1c1;
}

.footer {
  text-align: center;
  color: #656565;
  font-size: 10px;
  margin-top: 23px;
  direction: ltr;
}

@media (max-width: 420px) {
  .card {
    padding: 23px 18px;
  }
  .brand h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="circle one"></div>
  <div class="circle two"></div>
  <div class="circle three"></div>
</div>

<main class="container">

  <header class="brand">
    <div class="logo"><span>گ</span></div>
    <h1>گل یا پوچ</h1>
    <p>یک بازی، هزار راه برای بردن</p>
  </header>

  <section class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">
        ورود
      </button>

      <button class="tab" id="registerTab" type="button">
        ساخت حساب
      </button>
    </div>

    <h2 id="formTitle">خوش برگشتی!</h2>

    <p class="subtitle" id="formSubtitle">
      برای ورود به حساب بازی، اطلاعاتت رو وارد کن.
    </p>

    <form id="accountForm">

      <div class="field" id="usernameField" hidden>
        <label for="username">نام کاربری بازیکن</label>
        <input
          id="username"
          type="text"
          placeholder="مثلاً player123"
          minlength="3"
          maxlength="20"
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label for="email">ایمیل</label>
        <input
          id="email"
          type="email"
          placeholder="name@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">رمز عبور</label>
        <input
          id="password"
          type="password"
          placeholder="رمز عبورت"
          minlength="8"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="field" id="confirmField" hidden>
        <label for="confirmPassword">تکرار رمز عبور</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="رمز عبورت رو دوباره وارد کن"
          minlength="8"
          autocomplete="new-password"
        >
      </div>

      <button class="submit" id="submitButton" type="submit">
        ورود به حساب
      </button>

      <div
        class="message"
        id="message"
        role="status"
        aria-live="polite"
      ></div>

    </form>
  </section>

  <footer class="footer">
    GOL YA POOCH · PLAYER ACCESS
  </footer>

</main>

<script>

/* =====================================================
   🔴🔴🔴 بخش اتصال شماره ۱: آدرس پروژه 🔴🔴🔴

   عبارت داخل کوتیشن را با API URL خودت عوض کن.
   آدرس را از Supabase > Data API برداشتی.
   ===================================================== */

const SUPABASE_URL = "https://ewdsxuoimazoibfzuhih.supabase.co/rest/v1/ ;


/* =====================================================
   🔴🔴🔴 بخش اتصال شماره ۲: کلید عمومی 🔴🔴🔴

   عبارت داخل کوتیشن را با Publishable key خودت عوض کن.
   کلید را از Project Settings > API Keys برداشتی.
   ===================================================== */

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_WGnkiOWxaEQYs89xxkLp2Q_HCUBbSfw ;


/* =====================================================
   از این خط به بعد، کد اصلی سایت است.
   این بخش‌ها را تغییر نده.
   ===================================================== */

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const accountForm = document.getElementById("accountForm");

const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");

const usernameField = document.getElementById("usernameField");
const confirmField = document.getElementById("confirmField");

const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");

const submitButton = document.getElementById("submitButton");
const messageBox = document.getElementById("message");

let mode = "login";
let client = null;

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "message show " + type;
}

function clearMessage() {
  messageBox.textContent = "";
  messageBox.className = "message";
}

function setMode(nextMode) {
  mode = nextMode;
  clearMessage();

  const registering = mode === "register";

  loginTab.classList.toggle("active", !registering);
  registerTab.classList.toggle("active", registering);

  usernameField.hidden = !registering;
  confirmField.hidden = !registering;

  usernameInput.required = registering;
  confirmPasswordInput.required = registering;

  passwordInput.autocomplete =
    registering ? "new-password" : "current-password";

  formTitle.textContent =
    registering ? "حساب جدید بساز" : "خوش برگشتی!";

  formSubtitle.textContent = registering
    ? "ثبت‌نام کن و ماجراجویی‌ات رو شروع کن."
    : "برای ورود به حساب بازی، اطلاعاتت رو وارد کن.";

  submitButton.textContent =
    registering ? "ساخت حساب بازیکن" : "ورود به حساب";
}

loginTab.addEventListener("click", () => setMode("login"));
registerTab.addEventListener("click", () => setMode("register"));

function friendlyError(error) {
  const text = String(error.message || "").toLowerCase();

  if (text.includes("invalid login credentials")) {
    return "ایمیل یا رمز عبور اشتباهه.";
  }

  if (text.includes("already registered")) {
    return "این ایمیل قبلاً ثبت شده؛ وارد حسابت شو.";
  }

  if (
    text.includes("duplicate key") ||
    text.includes("profiles_username_lower_unique")
  ) {
    return "این نام کاربری قبلاً انتخاب شده؛ یکی دیگه انتخاب کن.";
  }

  if (text.includes("password") && text.includes("at least")) {
    return "رمز عبور کوتاهه؛ یک رمز قوی‌تر انتخاب کن.";
  }

  if (text.includes("user already registered")) {
    return "این ایمیل قبلاً ثبت شده.";
  }

  if (text.includes("fetch")) {
    return "اتصال برقرار نشد؛ آدرس پروژه و اینترنت رو بررسی کن.";
  }

  return "عملیات انجام نشد. اتصال و اطلاعات واردشده رو بررسی کن.";
}

accountForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearMessage();

  if (!client) {
    showMessage(
      "اتصال هنوز تنظیم نشده. دو مقدار ابتدای کد را بررسی کن.",
      "error"
    );
    return;
  }

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  submitButton.disabled = true;
  submitButton.textContent = "کمی صبر کن...";

  try {
    if (mode === "register") {
      const username = usernameInput.value.trim();
      const confirmPassword = confirmPasswordInput.value;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showMessage(
          "نام کاربری باید ۳ تا ۲۰ حرف انگلیسی، عدد یا زیرخط داشته باشه.",
          "error"
        );
        return;
      }

      if (password.length < 8) {
        showMessage(
          "رمز عبور باید حداقل ۸ کاراکتر داشته باشه.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("رمز عبورها یکسان نیستن.", "error");
        return;
      }

      const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            username: username
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage(
          "حساب ساخته شد! ثبت‌نام موفق بود.",
          "success"
        );
      } else {
        showMessage(
          "ثبت‌نام انجام شد! ایمیلت رو بررسی کن و در صورت درخواست، حسابت رو تأیید کن.",
          "success"
        );
      }

    } else {
      const { error } = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      showMessage(
        "با موفقیت وارد شدی! حساب بازیکنت آماده‌ست.",
        "success"
      );
    }

  } catch (error) {
    showMessage(friendlyError(error), "error");

  } finally {
    submitButton.disabled = false;
    submitButton.textContent =
      mode === "register" ? "ساخت حساب بازیکن" : "ورود به حساب";
  }
});


/* ساخت اتصال Supabase */

try {
  if (
    SUPABASE_URL.startsWith("https://") &&
    SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")
  ) {
    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }
} catch (error) {
  client = null;
}

setMode("login");

</script>

</body>
</html>
